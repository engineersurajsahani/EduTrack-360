services:
  - type: web
    name: edutrack360
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn edutrack360.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: edutrack360-db
          property: connectionString

databases:
  - name: edutrack360-db
    databaseName: edutrack360
    user: edutrack_user
    plan: free
